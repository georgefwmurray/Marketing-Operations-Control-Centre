title: "George Murray"
description: "George Murray is a marketing operations and technology leader with experience in MarTech, HubSpot, multi-brand operations, team leadership and AI transformation."
author: George Murray
url: "https://georgemurray.co.uk"
baseurl: ""
lang: en-GB
image:
  path: /assets/images/george-murray-social-card.png
  width: 1200
  height: 630
  alt: "George Murray — Marketing Operations and MarTech Leadership"
twitter:
  card: summary_large_image
# Add the GA4 Measurement ID (G-XXXXXXXXXX) to enable page-level analytics.
google_analytics: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Apply the shared layout to every page that does not specify its own.
# The agent and project detail pages are nested in directories, so a
# site-wide page default is more reliable than directory-specific scopes.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Keep the internal planning roadmap out of the public site and sitemap.
exclude:
  - Roadmap.md
  - Agents/**

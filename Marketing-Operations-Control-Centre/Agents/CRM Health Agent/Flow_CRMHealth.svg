<rect x="375" y="250" width="300" height="120" rx="12" fill="#EEF9F3" stroke="#5FBF8F" stroke-width="1.5"/>
<circle cx="401" cy="278" r="14" fill="#5FBF8F"/><text x="401" y="283" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="425" y="283" font-size="16" font-weight="700" fill="#1F2937">Human approval</text>
<text x="397" y="316" font-size="13" fill="#4B5563">A person approves which assets</text>
<text x="397" y="336" font-size="13" fill="#4B5563">are archived</text>

<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8923A"/></marker>
</defs>
<rect x="1" y="1" width="1048" height="508" rx="16" fill="#FFFFFF" stroke="#E3E7EE"/>
<text x="30" y="46" font-size="20" font-weight="700" fill="#1F2937">Agent Intake &amp; Approval Agent: how a request flows</text>
<g>
<rect x="30" y="80" width="300" height="120" rx="12" fill="#F3F6FC" stroke="#4F86D9" stroke-width="1.5"/>
<circle cx="56" cy="108" r="14" fill="#4F86D9"/><text x="56" y="113" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="80" y="113" font-size="16" font-weight="700" fill="#1F2937">Request raised in Teams</text>
<text x="52" y="146" font-size="13" fill="#4B5563">Requester starts a new agent request</text>
<text x="52" y="166" font-size="13" fill="#4B5563">through a Copilot Studio topic</text>
</g>
<g>
<rect x="375" y="80" width="300" height="120" rx="12" fill="#F3F6FC" stroke="#4F86D9" stroke-width="1.5"/>
<circle cx="401" cy="108" r="14" fill="#4F86D9"/><text x="401" y="113" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="425" y="113" font-size="16" font-weight="700" fill="#1F2937">Structured questions</text>
<text x="397" y="146" font-size="13" fill="#4B5563">Asks what the agent solves, what it</text>
<text x="397" y="166" font-size="13" fill="#4B5563">outputs and how it works</text>
</g>
<g>
<rect x="720" y="80" width="300" height="120" rx="12" fill="#F3F6FC" stroke="#4F86D9" stroke-width="1.5"/>
<circle cx="746" cy="108" r="14" fill="#4F86D9"/><text x="746" y="113" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="770" y="113" font-size="16" font-weight="700" fill="#1F2937">Request logged</text>
<text x="742" y="146" font-size="13" fill="#4B5563">Answers tidied into one request and</text>
<text x="742" y="166" font-size="13" fill="#4B5563">logged on the SharePoint request list</text>
</g>
<g>
<rect x="720" y="290" width="300" height="120" rx="12" fill="#F3F6FC" stroke="#4F86D9" stroke-width="1.5"/>
<circle cx="746" cy="318" r="14" fill="#4F86D9"/><text x="746" y="323" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="770" y="323" font-size="16" font-weight="700" fill="#1F2937">Overlap report</text>
<text x="742" y="356" font-size="13" fill="#4B5563">Checks for crossover with existing</text>
<text x="742" y="376" font-size="13" fill="#4B5563">agents and tech stack functionality</text>
</g>
<g>
<rect x="375" y="290" width="300" height="120" rx="12" fill="#F3F6FC" stroke="#4F86D9" stroke-width="1.5"/>
<circle cx="401" cy="318" r="14" fill="#4F86D9"/><text x="401" y="323" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="425" y="323" font-size="16" font-weight="700" fill="#1F2937">Two-Head approval</text>
<text x="397" y="356" font-size="13" fill="#4B5563">Head of Digital Marketing Operations and</text>
<text x="397" y="376" font-size="13" fill="#4B5563">Head of Digital Performance approve</text>
</g>
<g>
<rect x="30" y="290" width="300" height="120" rx="12" fill="#EEF9F3" stroke="#5FBF8F" stroke-width="1.5"/>
<circle cx="56" cy="318" r="14" fill="#5FBF8F"/><text x="56" y="323" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="80" y="323" font-size="16" font-weight="700" fill="#1F2937">Approved, then documented</text>
<text x="52" y="356" font-size="13" fill="#4B5563">Logged on the approved list, then the</text>
<text x="52" y="376" font-size="13" fill="#4B5563">agent creates the agent's documentation</text>
</g>
